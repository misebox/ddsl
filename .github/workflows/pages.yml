name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: サンプルの DDL を最新にする
        run: cargo run -p nounsql -- sql examples/sample.nsql -o examples/sample.sql

      - name: プレイグラウンドの WebAssembly をビルドする
        run: wasm-pack build crates/nounsql-wasm --target web --out-dir pkg --release

      - uses: oven-sh/setup-bun@v2

      - name: 依存をインストールする
        run: bun install --frozen-lockfile
        working-directory: site

      - name: サイトをビルドする
        run: bun run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
