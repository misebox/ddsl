name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: ビルド
        run: cargo build --release --target ${{ matrix.target }} -p ddsl -p ddsl-lsp

      - name: 固める (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="ddsl-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/ddsl target/${{ matrix.target }}/release/ddsl-lsp "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: 固める (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="ddsl-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/ddsl.exe target/${{ matrix.target }}/release/ddsl-lsp.exe "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          7z a "$name.zip" "$name" > /dev/null
          certutil -hashfile "$name.zip" SHA256 | sed -n 2p > "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ddsl-*.tar.gz
            ddsl-*.tar.gz.sha256
            ddsl-*.zip
            ddsl-*.zip.sha256
          if-no-files-found: error

  github-release:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: リリースノートを書く
        run: |
          cat > notes.md <<'NOTES'
          ## インストール

          ```
          cargo install ddsl
          cargo install ddsl-lsp
          ```

          バイナリを直接使う場合は下の一覧から選ぶ。`.sha256` で検証できる。

          ドキュメント: https://misebox.github.io/ddsl
          NOTES

      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            artifacts/*

  crates-io:
    needs: github-release
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: タグと Cargo.toml のバージョンが一致するか
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name=="ddsl") | .version')
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "タグ $GITHUB_REF_NAME と Cargo.toml の $version が食い違う" >&2; exit 1; }

      # 依存の順に公開する。後続はレジストリに載るまで待つ。
      - name: ddsl-core
        run: |
          cargo publish -p ddsl-core
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name=="ddsl-core") | .version')
          for _ in $(seq 30); do
            if curl -sf "https://crates.io/api/v1/crates/ddsl-core/$version" >/dev/null; then
              echo "ddsl-core $version がレジストリに載った"
              exit 0
            fi
            sleep 10
          done
          echo "ddsl-core $version が待っても載らなかった" >&2
          exit 1

      - name: ddsl-lsp
        run: cargo publish -p ddsl-lsp

      - name: ddsl
        run: cargo publish -p ddsl
