[package]
name = "ddsl"
description = "Data Definition Schema Language: a DSL for database schema design, compiled to PostgreSQL DDL."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["dsl", "ddl", "schema", "sql", "postgres"]
categories = ["database", "compilers", "command-line-utilities"]
readme = "README.md"
# 結合テストはリポジトリの examples/ を参照するのでパッケージに含めない。
exclude = ["tests"]

[dependencies]
ddsl-core.workspace = true
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
