<h1>プレイグラウンド</h1>

<p>
  ブラウザの中でコンパイルする。入力はどこにも送られない。
  コンパイラは <a href="https://github.com/misebox/nounsql/tree/main/crates/nounsql-wasm">WebAssembly に落とした本体</a>で、
  CLI と同じ字句解析・解決・コード生成を使う。
</p>

<div class="pg" id="pg" data-state="loading">
  <nav class="pg-samples" id="pg-samples" aria-label="サンプル"></nav>

  <div class="pg-bar">
    <div class="pg-tabs" role="tablist">
      <button type="button" role="tab" class="pg-tab is-on" data-pane="src"
              aria-selected="true">ソース</button>
      <button type="button" role="tab" class="pg-tab" data-pane="out"
              aria-selected="false">出力<span class="pg-badge" id="pg-badge" hidden></span></button>
    </div>
    <label class="pg-field">
      <span>ターゲット</span>
      <select id="pg-dialect"></select>
    </label>
    <button type="button" class="pg-copy" id="pg-copy" hidden>DDL をコピー</button>
    <span class="pg-status" id="pg-status">読み込み中…</span>
  </div>

  <div class="pg-pane" data-pane="src">
    <div class="pg-editor">
      <pre class="pg-hl" aria-hidden="true"><code id="pg-hl"></code></pre>
      <textarea id="pg-src" spellcheck="false" autocapitalize="off"
                autocorrect="off" aria-label="NounSQL のソース"></textarea>
    </div>
  </div>

  <div class="pg-pane" data-pane="out" hidden>
    <pre class="pg-out"><code id="pg-out"></code></pre>
  </div>

  <section class="pg-diags" id="pg-diags" hidden>
    <header class="pg-head">診断</header>
    <ul id="pg-diag-list"></ul>
  </section>
</div>

<noscript><p>プレイグラウンドには JavaScript が要る。</p></noscript>

<script type="module">
// examples/ に置いてある実物を読む。ここには説明だけを持つ。
const SAMPLES = [
  { file: "minimal.nsql", label: "最小", note: "nouns / mixin / belongs_to" },
  { file: "relations.nsql", label: "関連", note: "複数参照・自己参照・複合主キー" },
  { file: "blueprint.nsql", label: "blueprint", note: "1回の適用で3テーブル" },
  { file: "config.nsql", label: "config", note: "命名規則と制約を変える" },
  { file: "sample.nsql", label: "全構文", note: "仕様の構文をすべて含む" },
];

const el = (id) => document.getElementById(id);
const root = el("pg");
const src = el("pg-src");
const hl = el("pg-hl");
const out = el("pg-out");
const status = el("pg-status");
const badge = el("pg-badge");
const diags = el("pg-diags");
const diagList = el("pg-diag-list");

let wasm = null;

async function boot() {
  try {
    const mod = await import("./nounsql_wasm.js");
    await mod.default();
    wasm = mod;
  } catch {
    root.dataset.state = "failed";
    status.textContent = "コンパイラを読み込めなかった";
    status.className = "pg-status is-error";
    return;
  }

  const select = el("pg-dialect");
  for (const name of wasm.dialects()) {
    const option = document.createElement("option");
    option.value = option.textContent = name;
    select.append(option);
  }

  buildSampleList();
  root.dataset.state = "ready";
  select.addEventListener("change", run);
  src.addEventListener("input", schedule);
  src.addEventListener("scroll", syncScroll);
  el("pg-copy").addEventListener("click", copy);
  for (const tab of document.querySelectorAll(".pg-tab")) {
    tab.addEventListener("click", () => showPane(tab.dataset.pane));
  }
  await load(SAMPLES[0]);
}

function buildSampleList() {
  const nav = el("pg-samples");
  for (const sample of SAMPLES) {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "pg-sample";
    item.dataset.file = sample.file;
    item.innerHTML =
      `<span class="pg-sample-label"></span><span class="pg-sample-note"></span>`;
    item.querySelector(".pg-sample-label").textContent = sample.label;
    item.querySelector(".pg-sample-note").textContent = sample.note;
    item.addEventListener("click", () => load(sample));
    nav.append(item);
  }
}

async function load(sample) {
  for (const item of document.querySelectorAll(".pg-sample")) {
    item.classList.toggle("is-on", item.dataset.file === sample.file);
  }
  try {
    const res = await fetch(sample.file);
    src.value = res.ok ? await res.text() : `# ${sample.file} を読めなかった\n`;
  } catch {
    src.value = `# ${sample.file} を読めなかった\n`;
  }
  src.scrollTop = 0;
  run();
}

function showPane(name) {
  for (const tab of document.querySelectorAll(".pg-tab")) {
    const on = tab.dataset.pane === name;
    tab.classList.toggle("is-on", on);
    tab.setAttribute("aria-selected", String(on));
  }
  for (const pane of document.querySelectorAll(".pg-pane")) {
    pane.hidden = pane.dataset.pane !== name;
  }
  el("pg-copy").hidden = name !== "out";
  if (name === "src") src.focus();
}

let timer = 0;
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(run, 120);
}

function run() {
  if (!wasm) return;
  const source = src.value;
  hl.innerHTML = wasm.highlight_html(source);
  syncScroll();

  let result;
  try {
    result = wasm.compile(source, el("pg-dialect").value);
  } catch (e) {
    status.textContent = String(e);
    status.className = "pg-status is-error";
    return;
  }

  out.innerHTML = result.sql ? wasm.highlight_sql_html(result.sql) : "";
  renderDiagnostics(result.diagnostics);

  // 出力タブを見ていなくてもエラー件数が判るようにする。
  badge.hidden = result.errors === 0;
  badge.textContent = String(result.errors);

  if (result.errors > 0) {
    status.textContent = `エラー ${result.errors} 件`;
    status.className = "pg-status is-error";
  } else if (result.warnings > 0) {
    status.textContent = `${result.tables} テーブル / ${result.columns} 列 · 警告 ${result.warnings} 件`;
    status.className = "pg-status is-warning";
  } else {
    status.textContent = `${result.tables} テーブル / ${result.columns} 列`;
    status.className = "pg-status is-ok";
  }
}

function renderDiagnostics(list) {
  diagList.replaceChildren();
  diags.hidden = list.length === 0;
  for (const d of list) {
    const item = document.createElement("li");
    item.className = d.severity;
    const where = document.createElement("button");
    where.type = "button";
    where.className = "pg-where";
    where.textContent = `${d.line}:${d.column}`;
    where.addEventListener("click", () => jumpTo(d.line, d.column));
    const text = document.createElement("span");
    text.textContent = d.message;
    item.append(where, text);
    diagList.append(item);
  }
}

function jumpTo(line, column) {
  showPane("src");
  const lines = src.value.split("\n");
  let offset = 0;
  for (let i = 0; i < line - 1 && i < lines.length; i++) offset += lines[i].length + 1;
  src.focus();
  src.setSelectionRange(offset + column - 1, offset + column - 1);
}

function syncScroll() {
  hl.parentElement.scrollTop = src.scrollTop;
  hl.parentElement.scrollLeft = src.scrollLeft;
}

async function copy() {
  const button = el("pg-copy");
  try {
    await navigator.clipboard.writeText(out.textContent ?? "");
    button.textContent = "コピーした";
  } catch {
    button.textContent = "コピーできない";
  }
  setTimeout(() => (button.textContent = "DDL をコピー"), 1500);
}

boot();
</script>
