[package]
name = "nounsql-core"
description = "Core of the NounSQL compiler: lexer, parser, resolver, and PostgreSQL DDL codegen."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["dsl", "ddl", "schema", "sql", "postgres"]
categories = ["database", "compilers", "parser-implementations"]
readme = "README.md"
# 結合テストはリポジトリの examples/ を参照するのでパッケージに含めない。
exclude = ["tests"]

[features]
# 中間表現を JSON などに直列化できるようにする。
serde = ["dep:serde", "indexmap/serde"]

[dependencies]
indexmap = "2.12"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# preserve_order が無いと Value がキーをソートしてしまい、
# 宣言順を保っているという事実をテストできない。
serde_json = { version = "1", features = ["preserve_order"] }
